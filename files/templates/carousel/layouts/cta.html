<section class="slide {{theme}} l-cta"><div class="glow"></div>
  <div class="spacer"></div>
  <p class="headline">{{headline}}</p>
  <div class="cta-box" style="margin-top:60px">
    <p class="action">{{action}}</p>
    {{#detail}}<p class="detail">{{detail}}</p>{{/detail}}
  </div>
  <div class="spacer"></div>
  <div class="foot"><span class="brand"><i></i>{{brand}}</span><span>{{page}}/{{total}}</span></div>
</section>
