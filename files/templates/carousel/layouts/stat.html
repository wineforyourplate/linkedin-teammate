<section class="slide {{theme}} l-stat"><div class="glow"></div>
  {{#kicker}}<p class="kicker">{{kicker}}</p>{{/kicker}}
  <div class="spacer"></div>
  <p class="stat">{{stat}}{{#unit}}<small>{{unit}}</small>{{/unit}}</p>
  <p class="headline md" style="margin-top:36px">{{label}}</p>
  <div class="spacer"></div>
  {{#source}}<p class="source">{{source}}</p>{{/source}}
  <div class="foot" style="margin-top:28px"><span class="brand"><i></i>{{brand}}</span><span>{{page}}/{{total}}</span></div>
</section>
