<section class="slide {{theme}} l-thread">
  {{#kicker}}<p class="kicker">{{kicker}}</p>{{/kicker}}
  <p class="headline md" style="margin:22px 0 40px">{{headline}}</p>
  <div class="frame chat"><img src="{{image}}" alt=""></div>
  {{#caption}}<p class="caption" style="margin-top:28px">{{caption}}</p>{{/caption}}
  <div class="spacer"></div>
  <div class="foot"><span class="brand"><i></i>{{brand}}</span><span>{{page}}/{{total}}</span></div>
</section>
