<section class="slide {{theme}} l-steps">
  {{#kicker}}<p class="kicker">{{kicker}}</p>{{/kicker}}
  <p class="headline md" style="margin:22px 0 56px">{{headline}}</p>
  <ol class="steps">{{#steps}}<li><span>{{.}}</span></li>{{/steps}}</ol>
  <div class="spacer"></div>
  <div class="foot"><span class="brand"><i></i>{{brand}}</span><span>{{page}}/{{total}}</span></div>
</section>
