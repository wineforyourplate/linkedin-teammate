<section class="slide {{theme}} l-before-after">
  {{#kicker}}<p class="kicker">{{kicker}}</p>{{/kicker}}
  <p class="headline md" style="margin:22px 0 0">{{headline}}</p>
  <div class="spacer"></div>
  <div class="ba">
    <div class="side"><span class="label">{{#before_label}}{{before_label}}{{/before_label}}{{^before_label}}Before{{/before_label}}</span><p>{{before}}</p></div>
    <div class="side after"><span class="label">{{#after_label}}{{after_label}}{{/after_label}}{{^after_label}}Now{{/after_label}}</span><p>{{after}}</p></div>
  </div>
  <div class="spacer"></div>
  <div class="foot"><span class="brand"><i></i>{{brand}}</span><span>{{page}}/{{total}}</span></div>
</section>
